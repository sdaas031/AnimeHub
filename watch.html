<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AnimeHub — Просмотр</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0f;
    color: white;
}

header {
    background: #111118;
    padding: 18px 25px;
    border-bottom: 1px solid #24242d;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #ff3b81;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

.back {
    display: inline-block;
    color: #aaa;
    text-decoration: none;
    margin-bottom: 20px;
}

.back:hover {
    color: white;
}

h1 {
    margin-bottom: 20px;
}

.player {
    width: 100%;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #292933;
}

video {
    width: 100%;
    display: block;
    min-height: 300px;
    background: black;
}

.controls {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin: 20px 0;
}

.button {
    background: #ff3b81;
    color: white;
    text-decoration: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: bold;
}

.button:hover {
    background: #ff5b96;
}

.button.disabled {
    background: #292933;
    color: #777;
    pointer-events: none;
}

.episodes-title {
    margin-top: 30px;
    margin-bottom: 15px;
}

.episodes {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
    gap: 8px;
}

.episode {
    text-decoration: none;
    color: #ddd;
    background: #17171f;
    padding: 10px;
    text-align: center;
    border-radius: 7px;
    border: 1px solid #252530;
}

.episode:hover {
    background: #252531;
}

.episode.active {
    background: #ff3b81;
    color: white;
    border-color: #ff3b81;
}

@media (max-width: 600px) {
    .container {
        padding: 15px;
    }

    h1 {
        font-size: 22px;
    }

    video {
        min-height: 220px;
    }

    .button {
        padding: 10px 14px;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">AnimeHub</div>
</header>

<div class="container">

    <a class="back" id="backLink" href="index.html">
        ← Назад
    </a>

    <h1 id="animeTitle">Загрузка...</h1>

    <div class="player">
        <video id="videoPlayer" controls>
            <source id="videoSource" src="" type="video/mp4">
            Ваш браузер не поддерживает видео.
        </video>
    </div>

    <div class="controls">
        <a id="prevButton" class="button" href="#">
            ← Предыдущая
        </a>

        <a id="nextButton" class="button" href="#">
            Следующая →
        </a>
    </div>

    <h2 class="episodes-title">Серии</h2>

    <div id="episodeList" class="episodes"></div>

</div>

<script>

const animeDatabase = {

    "naruto": {
        title: "Наруто: Ураганные хроники",
        episodes: 500
    },

    "one-piece": {
        title: "Ван-Пис",
        episodes: 1150
    },

    "attack-on-titan": {
        title: "Атака титанов",
        episodes: 89
    },

    "demon-slayer": {
        title: "Клинок, рассекающий демонов",
        episodes: 63
    },

    "jujutsu-kaisen": {
        title: "Магическая битва",
        episodes: 48
    },

    "death-note": {
        title: "Тетрадь смерти",
        episodes: 37
    },

    "my-hero-academia": {
        title: "Моя геройская академия",
        episodes: 170
    },

    "chainsaw-man": {
        title: "Человек-бензопила",
        episodes: 12
    },

    "one-punch-man": {
        title: "Ванпанчмен",
        episodes: 24
    },

    "hunter-x-hunter": {
        title: "Охотник × Охотник",
        episodes: 148
    },

    "dr-stone": {
        title: "Доктор Стоун",
        episodes: 81
    }

};


const params = new URLSearchParams(window.location.search);

const animeId = params.get("anime") || "naruto";

let episode = parseInt(params.get("episode")) || 1;

const anime = animeDatabase[animeId] || animeDatabase["naruto"];


if (episode < 1) {
    episode = 1;
}

if (episode > anime.episodes) {
    episode = anime.episodes;
}


/* Название страницы */

document.title =
    anime.title + " — Серия " + episode + " | AnimeHub";


/* Заголовок */

document.getElementById("animeTitle").textContent =
    anime.title + " — Серия " + episode;


/* Ссылка назад */

document.getElementById("backLink").href =
    "anime.html?anime=" + animeId;


/* Предыдущая серия */

const prevButton = document.getElementById("prevButton");

if (episode > 1) {

    prevButton.href =
        "watch.html?anime=" +
        animeId +
        "&episode=" +
        (episode - 1);

} else {

    prevButton.classList.add("disabled");

}


/* Следующая серия */

const nextButton = document.getElementById("nextButton");

if (episode < anime.episodes) {

    nextButton.href =
        "watch.html?anime=" +
        animeId +
        "&episode=" +
        (episode + 1);

} else {

    nextButton.classList.add("disabled");

}


/* Создание списка серий */

const episodeList =
    document.getElementById("episodeList");


for (let i = 1; i <= anime.episodes; i++) {

    const link = document.createElement("a");

    link.className = "episode";

    link.textContent = i;

    link.href =
        "watch.html?anime=" +
        animeId +
        "&episode=" +
        i;

    if (i === episode) {
        link.classList.add("active");
    }

    episodeList.appendChild(link);
}

</script>

</body>
</html>
